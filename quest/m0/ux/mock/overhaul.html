<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kixel.live Studio: Simplified UX Overhaul</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #09090c;
    color: #f3f3f6;
    font-family: Inter, system-ui, -apple-system, sans-serif;
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 16px;
    background: #111116;
    border-bottom: 1px solid #2a2a35;
  }
  .bar button {
    font: 600 13px/1 Inter, system-ui, sans-serif;
    padding: 8px 12px;
    border-radius: 7px;
    border: 1px solid #2e2e3a;
    background: transparent;
    color: #9c9cae;
    cursor: pointer;
  }
  .bar button[aria-selected="true"] {
    background: #4f8cff;
    color: #fff;
    border-color: transparent;
  }
  body.shot .bar { display: none; }

  svg.ic {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
    display: inline-block;
    vertical-align: middle;
  }
  svg.ic.sm { width: 15px; height: 15px; }
  svg.ic.lg { width: 26px; height: 26px; }

  .frame {
    --bg: #09090c;
    --p1: #111116;
    --p2: #18181f;
    --p3: #22222b;
    --line: #2a2a35;
    --text: #f3f3f6;
    --dim: #8d8d9c;
    --faint: #5b5b69;
    --accent: #4f8cff;
    --cue: #ffb020;
    --ok: #35d07f;
    --err: #ff3b52;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;

    width: 1440px;
    height: 900px;
    background: var(--bg);
    color: var(--text);
    display: none;
    flex-direction: column;
    overflow: hidden;
    font-size: 14px;
    line-height: 1.35;
  }
  .frame.active { display: flex; }

  .topbar {
    height: 52px;
    padding: 0 18px;
    background: var(--p1);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    flex: none;
  }
  .logo {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: conic-gradient(from 210deg, #ff2d46, #ff8a3d, #ff2d46);
    flex: none;
  }
  .show-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
  }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 32px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--p2);
    color: var(--dim);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
  }
  .pill-btn.active { background: var(--p3); color: var(--text); border-color: #3c3c4c; }
  .pill-btn.accent { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  .pill-btn.live {
    background: var(--accent);
    color: #fff;
    border-color: transparent;
    font-weight: 700;
    letter-spacing: .04em;
    box-shadow: 0 0 22px rgba(79, 140, 255, .45);
  }
  .pill-btn.golive {
    background: #f3f3f6;
    color: #09090c;
    border-color: transparent;
    font-weight: 700;
    letter-spacing: .05em;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.rec { background: var(--err); }
  .dot.dim { background: var(--faint); }
  .spacer { flex: 1; min-width: 8px; }
  .ib {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    border: 1px solid transparent;
  }
  .ib.boxed { background: var(--p2); border-color: var(--line); }
  .ib.on { background: var(--p3); color: var(--text); border-color: #3c3c4c; }

  .body-row {
    flex: 1;
    min-height: 0;
    display: flex;
    position: relative;
  }

  .rail-left {
    width: 248px;
    flex: none;
    background: var(--p1);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 8px;
  }
  .sec-cap {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .layer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    color: var(--text);
    font-size: 13.5px;
  }
  .layer-row.sel {
    background: rgba(79, 140, 255, .16);
    outline: 1.5px solid rgba(79, 140, 255, .6);
  }
  .layer-ico {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: var(--p3);
    color: var(--dim);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .layer-row.sel .layer-ico { background: var(--accent); color: #fff; }
  .layer-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-sub { display: block; font-size: 11px; color: var(--dim); }
  .add-big {
    margin-top: auto;
    height: 38px;
    border-radius: 9px;
    border: 1px solid rgba(79, 140, 255, .5);
    background: rgba(79, 140, 255, .14);
    color: #c4daff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 600;
    font-size: 13.5px;
  }

  .stage {
    flex: 1;
    min-width: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(120% 90% at 50% 0%, #15151e, var(--bg));
  }
  .canvas-16-9 {
    position: relative;
    width: 100%;
    max-width: 1120px;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    background: #0d0e14;
    border: 2px solid var(--line);
    overflow: hidden;
    box-shadow: 0 18px 54px rgba(0, 0, 0, .5);
  }
  .canvas-16-9.onair {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 54px rgba(79, 140, 255, .24);
  }

  .scene-game {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #1b0b3a 0%, #581e6c 42%, #ff7a3d 58%, #130721 58.5%, #090412 100%);
  }
  .scene-game .sun {
    position: absolute;
    left: 41%;
    top: 21%;
    width: 18%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: linear-gradient(#ffd166, #ff3d7f);
  }
  .scene-game .grid {
    position: absolute;
    left: -15%;
    right: -15%;
    top: 58.5%;
    bottom: 0;
    background:
      repeating-linear-gradient(90deg, rgba(255,61,240,.35) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(0deg, rgba(255,61,240,.35) 0 1px, transparent 1px 28px);
  }
  .cam-pip {
    position: absolute;
    right: 4%;
    bottom: 7%;
    width: 21%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: linear-gradient(155deg, #2b3556, #141928);
    box-shadow: 0 0 0 3px #fff, 0 12px 32px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .cam-pip::before {
    content: "";
    position: absolute;
    left: 32%;
    top: 20%;
    width: 36%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #ebb894;
  }
  .cam-pip::after {
    content: "";
    position: absolute;
    left: 16%;
    top: 58%;
    width: 68%;
    height: 55%;
    border-radius: 45% 45% 0 0;
    background: #4f8cff;
  }
  .lower-third {
    position: absolute;
    left: 4%;
    bottom: 8%;
    padding: 9px 15px;
    border-radius: 8px;
    background: rgba(15, 16, 22, .84);
    border-left: 4px solid var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .lower-third span {
    display: block;
    font-weight: 400;
    font-size: 12px;
    color: #c5c6d4;
    letter-spacing: 0;
  }

  .stage-badge {
    position: absolute;
    left: 14px;
    top: 14px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    background: rgba(255, 176, 32, .94);
    color: #1a1200;
    z-index: 3;
  }
  .stage-badge.live { background: var(--accent); color: #fff; }

  .sel-frame {
    position: absolute;
    right: 4%;
    bottom: 7%;
    width: 21%;
    aspect-ratio: 1;
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    z-index: 4;
  }
  .sel-frame i {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #fff;
    border: 2px solid var(--accent);
    border-radius: 2px;
  }
  .sel-frame i:nth-child(1) { left: -7px; top: -7px; }
  .sel-frame i:nth-child(2) { right: -7px; top: -7px; }
  .sel-frame i:nth-child(3) { left: -7px; bottom: -7px; }
  .sel-frame i:nth-child(4) { right: -7px; bottom: -7px; }

  .float-bar {
    position: absolute;
    right: 3%;
    top: 38%;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px;
    border-radius: 10px;
    background: rgba(24, 24, 31, .96);
    border: 1px solid #383847;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .6);
  }
  .float-bar span {
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .float-bar span.del { color: #ff6b7c; }

  .empty-prompt {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 32px;
    text-align: center;
    background: radial-gradient(circle at 50% 40%, #171822, #0b0b10);
  }
  .empty-prompt h3 { margin: 0; font-size: 28px; font-weight: 700; color: var(--text); }
  .empty-prompt p { margin: 0; font-size: 15px; color: var(--dim); max-width: 520px; }
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 720px;
    margin-top: 8px;
  }
  .quick-card {
    background: var(--p2);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
  }
  .quick-card.hi {
    border-color: rgba(79, 140, 255, .65);
    background: rgba(79, 140, 255, .13);
  }
  .quick-card .qico {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--p3);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .quick-card.hi .qico { background: var(--accent); color: #fff; }
  .quick-card small { font-size: 12px; font-weight: 400; color: var(--dim); }

  .inspector {
    width: 288px;
    flex: none;
    background: var(--p1);
    border-left: 1px solid var(--line);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .insp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    font-weight: 700;
    font-size: 15px;
  }
  .insp-group { display: flex; flex-direction: column; gap: 10px; }
  .shape-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .shape-btn {
    height: 38px;
    border-radius: 8px;
    background: var(--p2);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shape-btn.on { background: rgba(79, 140, 255, .18); border-color: var(--accent); }
  .sh { width: 16px; height: 16px; background: var(--dim); }
  .shape-btn.on .sh { background: var(--accent); }
  .sh.r { border-radius: 4px; }
  .sh.c { border-radius: 50%; }
  .sh.a { border-radius: 8px 8px 2px 2px; }

  .ctrl-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13.5px;
    color: var(--text);
  }
  .slider-track {
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: var(--p3);
    position: relative;
  }
  .slider-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
  .slider-thumb {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.5);
  }
  .toggle {
    width: 38px;
    height: 20px;
    border-radius: 10px;
    background: var(--p3);
    border: 1px solid var(--line);
    position: relative;
    flex: none;
  }
  .toggle::after {
    content: "";
    position: absolute;
    left: 2px;
    top: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--dim);
  }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle.on::after { left: 20px; background: #fff; }
  .select-box {
    height: 36px;
    padding: 0 10px;
    border-radius: 8px;
    background: var(--p2);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text);
  }
  .disclosure {
    margin-top: 4px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 13px;
    font-weight: 600;
  }

  .dock {
    height: 112px;
    background: var(--p1);
    border-top: 1px solid var(--line);
    display: flex;
    align-items: stretch;
    flex: none;
  }
  .scenes-strip {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
  }
  .scene-pad {
    width: 138px;
    flex: none;
    background: var(--p2);
    border: 2px solid var(--line);
    border-radius: 9px;
    padding: 4px;
  }
  .scene-pad.on {
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(79, 140, 255, .28);
  }
  .scene-pad .thumb {
    height: 60px;
    border-radius: 5px;
    overflow: hidden;
    position: relative;
    background: #14151e;
  }
  .scene-pad .sname {
    padding: 6px 4px 2px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text);
  }
  .scene-pad.add-pad {
    width: 62px;
    height: 88px;
    border-style: dashed;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
  }

  .audio-dock {
    width: 420px;
    flex: none;
    border-left: 1px solid var(--line);
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 9px;
  }
  .aud-row { display: flex; align-items: center; gap: 10px; }
  .aud-mute {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--p2);
    border: 1px solid var(--line);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    flex: none;
  }
  .aud-mute.muted { background: var(--cue); border-color: var(--cue); color: #1a1200; }
  .aud-name { width: 68px; font-size: 13px; font-weight: 500; color: var(--text); flex: none; }
  .aud-slider-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .meter-bar { height: 4px; border-radius: 2px; background: var(--p3); overflow: hidden; }
  .meter-bar i {
    display: block;
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--ok) 0%, var(--ok) 75%, var(--cue) 100%);
  }
  .aud-db {
    width: 48px;
    text-align: right;
    font: 500 12px/1 var(--mono);
    color: var(--dim);
    white-space: nowrap;
    flex: none;
  }
  .aud-gear {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--faint);
    flex: none;
  }
  .aud-gear.open { background: var(--p3); color: var(--text); }

  .dim-scrim {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 8, .72);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 24px;
  }
  .modal {
    width: 100%;
    max-width: 820px;
    background: var(--p1);
    border: 1px solid #353545;
    border-radius: 14px;
    box-shadow: 0 28px 70px rgba(0, 0, 0, .8);
    overflow: hidden;
  }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .modal-tabs { display: flex; gap: 6px; }
  .modal-tabs span {
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--dim);
  }
  .modal-tabs span.on { background: var(--p3); color: var(--text); }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .src-card { background: var(--p2); border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
  .src-card.hi { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(79, 140, 255, .35); }
  .src-thumb {
    height: 126px;
    position: relative;
    background: #131520;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .src-meta { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .src-meta b { font-size: 14px; font-weight: 600; display: block; }
  .src-meta small { font-size: 12px; color: var(--dim); display: block; }
  .click-pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: var(--accent); color: #fff; }

  .popover {
    position: absolute;
    background: #16161e;
    border: 1px solid #3a3a4d;
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .75);
    z-index: 12;
  }
  .input-box {
    height: 36px;
    padding: 0 12px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font: 500 13px/36px var(--mono);
    display: flex;
    align-items: center;
  }
  .input-box.placeholder { font-family: Inter, system-ui, sans-serif; color: var(--faint); }

  .settings-grid { display: grid; grid-template-columns: 200px 1fr; height: 520px; }
  .settings-nav {
    background: #0e0e13;
    border-right: 1px solid var(--line);
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .snav-item { padding: 9px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--dim); }
  .snav-item.on { background: var(--p3); color: var(--text); font-weight: 600; }
  .settings-pane { padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; }
  .mod-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid #1f1f29;
  }
  .mod-row:last-child { border-bottom: none; }
  .mod-row b { font-size: 14.5px; display: block; margin-bottom: 2px; }
  .mod-row small { font-size: 12.5px; color: var(--dim); display: block; }
</style>
</head>
<body>
<div class="bar" role="tablist">
  <button data-v="first" aria-selected="true">First Launch</button>
  <button data-v="studio" aria-selected="false">Unified Studio</button>
  <button data-v="edit" aria-selected="false">Selected Layer</button>
  <button data-v="add" aria-selected="false">1-Click Add</button>
  <button data-v="popovers" aria-selected="false">Audio &amp; Go Live</button>
  <button data-v="mods" aria-selected="false">Mods &amp; Settings</button>

                  <div class="mod-row"><div><b>Dual Format · Multiview · Phone Remote · Published Scenes · Scene Graph</b><small>Simultaneous portrait stream, multi-window monitor, mobile remote, independent broadcasts</small></div><div class="toggle"></div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    ${dockHtml(SCENES_FULL, audRow(I.mic,'Mic',76,0,'0 dB'), true)}`
};

const mount = document.getElementById('mount');
const buttons = document.querySelectorAll('.bar button');
Object.entries(FRAMES).forEach(([id, html]) => {
  const el = document.createElement('div');
  el.className = 'frame';
  el.id = 'f-' + id;
  el.innerHTML = html;
  mount.appendChild(el);
});

function show(id) {
  buttons.forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === id)));
  mount.querySelectorAll('.frame').forEach(f => f.classList.toggle('active', f.id === 'f-' + id));
}

buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.v)));
if (location.hash.startsWith('#shot:')) {
  document.body.classList.add('shot');
  show(location.hash.slice(6));
} else {
  show('studio');
}
</script>
</body>
</html>
