<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio, later features</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
/* shared by several frames */
.rl{position:absolute;left:6px;top:6px;z-index:3;display:flex;align-items:center;gap:5px;padding:0 7px;border-radius:4px;background:var(--sel);color:#fff;font:700 12px/20px var(--disp);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.face{background:linear-gradient(160deg,#2b3350,#141826)}
.face::before{content:"";position:absolute;left:39%;top:16%;width:22%;aspect-ratio:1;border-radius:50%;background:#e9b48f}
.face::after{content:"";position:absolute;left:26%;top:60%;width:48%;height:60%;border-radius:45% 45% 0 0;background:var(--c,#3b6cf6)}
.ly small.amber,.amber{color:var(--cue)}
.hb{width:20px;height:20px;border-radius:50%;background:var(--cue);color:#1a1200;display:grid;place-items:center;flex:none}
.side .sec small{display:block;color:var(--faint);font-size:10.5px;margin-top:2px}
.btn.pri{background:var(--text);color:#111;border-color:transparent}
.xcur{width:22px;height:22px;flex:none;fill:#fff;stroke:#000;stroke-width:1.5;stroke-linejoin:round;filter:drop-shadow(0 2px 3px #000a)}

/* autoplace */
.ap .pic .cam,.ap .selbox{width:15%}
.ap-o{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:4}
.ap-heat{position:absolute;border-radius:50%;background:radial-gradient(closest-side,#4de3ffa6,#4de3ff3d 55%,transparent);filter:blur(5px)}
.ap-hl{position:absolute;font:700 10px/1 var(--disp);letter-spacing:.14em;color:#c9f6ff;padding:3px 5px;border-radius:3px;background:#06222bd9}
.ap-slot{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;border:1.5px dashed #ffffff80}
.ap-slot.was{border:2px dashed #fff;background:#ffffff1f}
.ap-arrow{position:absolute;inset:0;width:100%;height:100%}
.ap-arrow path{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 1px 2px #000)}
.ap-note{position:absolute;z-index:7;padding:5px 8px;border-radius:6px;background:#000c;border:1px solid #fff3;font:500 11.5px/1 var(--ui);white-space:nowrap}
.ap-leg{gap:18px}
.ap-leg .row{gap:7px}
.ap-leg span{white-space:nowrap}
.ap-k{width:14px;height:14px;border-radius:50%;flex:none}
.ap-k.h{background:radial-gradient(closest-side,#4de3ff,#4de3ff40)}
.ap-k.s{border:1.5px dashed #ffffff99}
.ap-k.c{border-radius:3px;border:2px solid var(--sel)}
.ap-box{display:flex;flex-direction:column;gap:9px;padding:10px;border-radius:8px;background:var(--p2);border:1px solid var(--line);font-size:12px}
.ap-chips{display:flex;flex-wrap:wrap;gap:6px}
.ap-chips .chip{border-color:var(--sel);background:#4f8cff22;color:var(--text)}
.ap-grid{display:grid;grid-template-columns:repeat(3,17px);gap:3px;flex:none}
.ap-grid i{height:11px;border-radius:2px;background:#3d3d4b;border:1px solid #3d3d4b}
.ap-grid i.x{background:transparent;border-style:dashed}
.ap-grid i.on{background:var(--sel);border-color:var(--sel)}

/* autolayout */
.al-wrap{justify-content:center;gap:26px;padding-top:12px}
.al-row{display:flex;align-items:flex-end;justify-content:center;gap:20px}
.al-fig{display:flex;flex-direction:column;gap:14px}
.al-head{display:flex;align-items:baseline;gap:10px;padding-left:2px}
.al-head b{font:700 20px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
.al-fig .tally{width:630px;height:354px;aspect-ratio:auto}
.tally.past{outline-color:#3a3a48;box-shadow:none}
.al-join{width:96px;height:354px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim);font-size:12px;text-align:center}
.al-join .chip{color:var(--text);background:var(--p2)}
.lay{background:linear-gradient(135deg,#151c33,#0a0d18)}
.ls{border-radius:1.2cqw}
.ls .in{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.tally .ls{outline:2px dashed var(--sel);outline-offset:3px}
.pad .ls .rl,.pad .ls .nmt{display:none}
.nmt{position:absolute;left:1.2cqw;bottom:1.2cqw;z-index:2;font:600 1.8cqw/1 var(--ui);color:#fff;background:#000a;padding:.6cqw 1cqw;border-radius:.6cqw}
.al-strip{align-self:center;width:1366px;display:flex;align-items:stretch;gap:22px;padding:16px 20px;border-radius:12px;background:var(--p1);border:1px solid var(--line)}
.al-col{display:flex;flex-direction:column;gap:12px}
.al-roles{display:flex;gap:10px}
.al-role{width:236px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;background:var(--p2);border:1px solid var(--line);font-size:12.5px}
.al-role .rl{position:static}
.al-role small{display:block;color:var(--faint);font-size:10.5px;margin-top:3px}
.al-pres{display:flex;gap:10px}
.al-pre{width:104px;display:flex;flex-direction:column;gap:7px;align-items:center;font-size:11.5px;color:var(--dim)}
.al-pre div{position:relative;width:104px;height:58px;border-radius:7px;background:var(--p2);border:1px solid var(--line)}
.al-pre div i{position:absolute;border-radius:2px;background:#5b5b69}
.al-pre.on{color:var(--text)}.al-pre.on div{border-color:var(--sel);background:#4f8cff22}.al-pre.on div i{background:var(--sel)}
.al-div{width:1px;background:var(--line)}

/* capture health */
.ch-out{position:absolute;inset:7px;border:2px dashed var(--cue);border-radius:6px;z-index:4}
.ch-badge{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:5;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 9px;border-radius:17px;background:var(--cue);color:#1a1200;font:700 16px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.ch-pop{position:absolute;left:10px;top:342px;width:270px;z-index:30;border-radius:12px;background:#191920;border:1px solid #ffb02080;box-shadow:0 20px 50px #000c;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;line-height:1.4}
.ch-pop::before{content:"";position:absolute;right:15px;top:-7px;width:12px;height:12px;transform:rotate(45deg);background:#191920;border-left:1px solid #ffb02080;border-top:1px solid #ffb02080}
.ch-pop b{font:600 14px/1.3 var(--ui)}
.ch-pop .btn{justify-content:center}
.pad .nm .hb{width:15px;height:15px}.pad .nm .hb svg{width:10px;height:10px}

/* mini controller */
.mn{grid-template:30px 1fr/1fr}
.mn-bar{display:flex;align-items:center;gap:14px;padding:0 10px;background:#0b0b0f;border-bottom:1px solid #000;font:500 12px/1 var(--ui);color:#d5d5dd}
.mn-tray{display:flex;align-items:center;gap:7px;height:24px;padding:0 8px;border-radius:6px}
.mn-tray.me{background:var(--p3);color:#fff}
.mn-tray b{font:500 11.5px/1 var(--mono)}
.mn-tray .logo{width:14px;height:14px;border-radius:4px}
.mn-desk{position:relative;min-height:0}
.mn-mini{position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:7px;padding:6px 8px 6px 4px;border-radius:14px;background:#121218f5;border:1px solid #3a3a48;box-shadow:0 16px 40px #000c}
.mn-grip{width:16px;display:grid;place-items:center;color:var(--faint)}
.mn-pad{position:relative;width:84px;height:50px;border-radius:8px;border:2px solid transparent;overflow:hidden;background:#000}
.mn-pad.air{border-color:var(--air);box-shadow:0 0 16px #ff2d4666}
.mn-pad kbd{position:absolute;right:3px;top:3px;z-index:2;background:#000b;font-size:9px}
.mn-sep{width:1px;height:30px;background:var(--line);margin:0 3px}
.mn-btn{width:38px;height:38px;border-radius:10px;background:var(--p3);display:grid;place-items:center}
.mn-mini .dot{margin:0 4px}
.mn-cap{position:absolute;left:50%;top:104px;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:8px;background:#000c;border:1px solid #fff2;font:500 12px/1 var(--ui);white-space:nowrap}
.mn-menu{position:absolute;right:12px;top:5px;width:262px;z-index:10;border-radius:10px;background:#17171ef7;border:1px solid #3a3a48;box-shadow:0 20px 50px #000c;padding:6px;font-size:12.5px}
.mn-menu .mr{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border-radius:6px}
.mn-menu .mr.on{background:var(--p3)}
.mn-menu .mr b{font:500 12px/1 var(--mono)}
.mn-menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.mn-menu .cap{padding:7px 9px 5px;display:block}
.mn-menu .sw{width:14px;display:grid;place-items:center;flex:none}

/* privacy shield */
.sh-desk{background:linear-gradient(140deg,#17324f,#256a73 60%,#d8b25e)}
.sh-win{border-radius:1cqw;overflow:hidden;background:#f3efe6;box-shadow:0 1.5cqw 4cqw #0008}
.sh-tb{height:3.4cqw;background:#d9d4c8;display:flex;align-items:center;gap:.7cqw;padding:0 1.2cqw;font:600 1.4cqw/1 var(--ui);color:#3a372f}
.sh-tb i{width:1cqw;height:1cqw;border-radius:50%;background:#0003}
.sh-tb b{margin-left:.8cqw}
.sh-doc{padding:2.2cqw 2.6cqw;color:#2a2822}
.sh-doc b{display:block;font:700 2.8cqw/1 var(--disp);letter-spacing:.02em}
.sh-doc i{display:block;margin-top:1.8cqw;height:24cqw;width:88%;background:repeating-linear-gradient(#2a28224d 0 .5cqw,transparent .5cqw 2.5cqw)}
.sh-win.priv{background:#101015 repeating-linear-gradient(-45deg,#ffffff0d 0 1.2cqw,transparent 1.2cqw 2.4cqw);display:grid;place-items:center;box-shadow:none}
.sh-win.priv svg.i{width:7cqw;height:7cqw;color:#ffffffb3;stroke-width:1.6}
.sh-task{left:32%;right:32%;bottom:2.5%;height:5.6%;border-radius:1.2cqw;background:#0b0f18cc;display:flex;align-items:center;justify-content:center;gap:1.3cqw}
.sh-task i{width:2.1cqw;height:2.1cqw;border-radius:.5cqw;background:#fff5}
.sh-task i.me{background:conic-gradient(from 210deg,var(--air),#ff8a3d,var(--air))}
.sh-chip{left:calc(51% + 8px);top:calc(8% + 8px);z-index:6}
.sh-list{display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.sh-app{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;font-size:12.5px}
.sh-app.open{background:var(--p2)}
.sh-app .ic{font:700 13px/1 var(--disp)}
.sh-app .logo{width:30px;height:30px;border-radius:8px;flex:none}

/* drop anything */
.dr-land{position:absolute;z-index:6;border:2px dashed var(--sel);border-radius:6px;background:#4f8cff24}
.dr-land .rl{left:-2px;top:-28px}
.dr-logo{border-radius:50%;background:radial-gradient(closest-side,transparent 50%,#fff 53% 78%,transparent 81%)}
.dr-land>.dr-logo{position:absolute;inset:10%;opacity:.55}
.dr-cur{position:absolute;left:72%;top:70%;width:max-content;display:flex;align-items:flex-start;gap:2px}
.dr-chip{margin-top:16px;display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;border-radius:8px;background:#1c1c25f2;border:1px solid var(--sel);font:500 12px/1 var(--ui);white-space:nowrap;box-shadow:0 10px 24px #000a}
.dr-chip .dr-logo{width:22px;height:22px;background-color:#101015}
.dr-trail{position:absolute;inset:0;width:1440px;height:900px;z-index:35;pointer-events:none}
.dr-trail path{fill:none;stroke:#fff;stroke-opacity:.5;stroke-width:2;stroke-dasharray:2 8;stroke-linecap:round}
.dr-fm{position:absolute;left:1104px;top:334px;width:322px;z-index:30;border-radius:10px;overflow:hidden;background:#20222a;border:1px solid #3d404c;box-shadow:0 24px 60px #000d;font:12px/1.3 var(--ui);color:#e6e7ec}
.dr-fmt{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#2a2d37;border-bottom:1px solid #3d404c;font-weight:600}
.dr-files{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:14px 12px 12px}
.dr-file{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:#c9cbd4}
.dr-file .t{position:relative;width:88px;height:62px;border-radius:6px;background:#101015;display:grid;place-items:center;color:#8d8d9c;overflow:hidden}
.dr-file.go .t{outline:2px dashed #fff5;outline-offset:-2px;background:transparent}
.dr-file.go{color:#8d8d9c}
.dr-file .dr-logo{width:44px;height:44px}
.dr-foot{padding:8px 12px;border-top:1px solid #3d404c;color:#8d8d9c;font-size:11px}

/* multiview */
.mv{grid-template:96px 1fr/1fr;padding:26px 28px 28px;gap:20px;background:#050507}
.mv-h{display:flex;align-items:center;gap:14px}
.mv-h .ttl{font:700 26px/1 var(--disp);letter-spacing:.16em}
.mv-h .sub{margin-top:8px;font-size:12.5px;color:var(--dim)}
.mv-h .clk{font:700 76px/1 var(--disp);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.mv-h .side3{flex:1;display:flex;align-items:center;gap:14px}
.mv-g{display:grid;grid-template-columns:repeat(4,1fr);gap:0 20px;align-content:space-between;min-height:0}
.mv-t{border-radius:9px;background:var(--p1);outline:1px solid var(--line)}
.mv-t .th{aspect-ratio:16/9;border-radius:9px 9px 0 0;overflow:hidden}
.mv-n{height:38px;display:flex;align-items:center;gap:9px;padding:0 11px;font:600 17px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.mv-n kbd{font-size:10px}
.mv-n svg{color:var(--dim)}
.mv-n em{font:700 13px/20px var(--disp);font-style:normal;letter-spacing:.12em;padding:0 7px;border-radius:4px}
.mv-t.air{outline:3px solid var(--air);box-shadow:0 0 40px #ff2d4640}
.mv-t.air .mv-n{background:#2a0b12;border-radius:0 0 9px 9px}.mv-t.air em{background:var(--air);color:#fff}
.mv-t.cued{outline:3px solid var(--cue);box-shadow:0 0 40px #ffb02026}
.mv-t.cued .mv-n{background:#2a1d05;border-radius:0 0 9px 9px}.mv-t.cued em{background:var(--cue);color:#1a1200}
.mv-alpha{background:repeating-conic-gradient(#1c1c23 0 25%,#131318 0 50%) 0 0/7cqw 7cqw}
.mv-alert{left:27%;top:36%;width:46%;padding:2.4cqw 3cqw;border-radius:1.6cqw;background:#17171ef2;border-left:1cqw solid var(--cue);font:600 3.6cqw/1.2 var(--ui);color:#fff}
.mv-alert small{display:block;font:500 2.6cqw/1.3 var(--ui);color:var(--dim)}
.mv-clip{background:radial-gradient(circle at 30% 20%,#3f6fd1,#101a3a 60%,#070b18);display:grid;place-items:center}
.mv-clip b{position:static;font:700 12cqw/1 var(--disp);letter-spacing:.08em;color:#fff}

/* private panels */
.pn{background:#05050a}
.pn-h{position:absolute;top:17px;display:flex;align-items:baseline;gap:10px;font-size:12.5px;color:var(--dim)}
.pn-h b{font:700 18px/1 var(--disp);letter-spacing:.12em;color:var(--text)}
.pn-rule{position:absolute;left:787px;top:16px;bottom:14px;width:1px;background:var(--line)}
.pn .win{position:absolute;left:12px;top:50px;width:540px;height:836px;margin:0}
.pn .win .tally .game .hp{top:17%}
.pn-chat{position:absolute;left:562px;top:50px;width:214px;height:548px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--p1);display:flex;flex-direction:column;box-shadow:0 20px 50px #000a}
.pn-tb{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;border-bottom:1px solid var(--line);color:var(--dim)}
.pn-tb b{font:600 14px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.pn-lock{flex:none;display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--p2);border-bottom:1px solid var(--line);font:500 11.5px/1 var(--ui);color:var(--dim);white-space:nowrap}
.pn-lock svg{color:var(--text)}
.pn-b{position:absolute;left:800px;top:50px;width:628px;height:836px;display:grid;grid-template:44px 1fr/60px 1fr 232px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.pn-b .top{gap:8px;padding:0 10px}
.pn-b .snav .ib{margin-top:auto}
.pn-mid{display:flex;flex-direction:column;min-width:0;min-height:0}
.pn-mid .stagewrap{flex:1}
.pn-sc{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--p1)}
.pn-sc .pad{width:auto;flex:1;min-width:0}
.pn-sc .pad .th{height:92px}
.pn-sc .pad .nm{font-size:12.5px;padding:6px 2px 7px}
.pn-sc .pad .tg{left:7px;top:7px;font-size:10px;line-height:14px;padding:0 4px}
.pn-b .mix{width:auto;border:0;border-top:1px solid var(--line);background:var(--p1)}
.pn-b .side .tabs span:last-child{margin-left:auto;padding-bottom:8px}

/* both formats */
.du-row{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:44px}
.du-fig{display:flex;flex-direction:column;gap:12px}
.du-fig .tally{aspect-ratio:auto}
.du-cap{display:flex;align-items:center;gap:8px;height:36px;font-size:12px;color:var(--dim)}
.du-cap .cap{color:var(--text);font-size:13px}
.du-cap .ctx{position:static;box-shadow:none}
.ctx span.du-lab{color:var(--dim);padding-right:4px}
.du .pad:not(.add){width:auto}
.du .pad .th{display:flex;gap:4px;height:60px;border-radius:0;overflow:visible}
.du .pad .th>div{height:60px;border-radius:5px;overflow:hidden;flex:none}
.du-l{width:107px}.du-p{width:34px}
.du .pad kbd{position:static;background:#0006}
.du .pad .nm{padding:6px 4px 6px}
.pic.port.game .sun{left:25%;top:20%;width:50%}
.pic.port.game .hp{left:6%;top:10%;width:34%;height:1.3%}
.pic.port.game .map{right:6%;top:4%;width:20%}
.pic.port.game .ammo{left:8%;bottom:21%;font-size:7cqw}
.pic.port.game .grid{background:repeating-linear-gradient(90deg,#ff3df055 0 .5cqw,transparent .5cqw 12cqw),repeating-linear-gradient(0deg,#ff3df055 0 .5cqw,transparent .5cqw 8cqw);transform:perspective(80cqw) rotateX(58deg)}
.pic.port.chat .cam{left:8%;top:5%;right:auto;bottom:auto;width:84%;height:50%;border-radius:4cqw}
.pic.port.chat .col{left:8%;right:auto;top:59%;width:84%;height:36%;border-radius:4cqw;background-image:repeating-linear-gradient(#fff3 0 2.5cqw,transparent 2.5cqw 8cqw);background-position:4cqw 5cqw}
.pic.port.duo .cam{left:10%;right:auto;width:80%;height:42%;border-radius:4cqw;bottom:auto}
.pic.port.duo .cam.a{top:6%}.pic.port.duo .cam.b{top:52%}
.pic.port.soon b{font-size:15cqw}
.pic.port.brb b{font-size:28cqw}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="warn" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4ZM12 10v4M12 17h.01"/></symbol>
<symbol id="grip" viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3V6Z"/></symbol>
<symbol id="file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3ZM14 3v4h4M9 13h6M9 17h6"/></symbol>
<symbol id="popout" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
<symbol id="dockr" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
<symbol id="tiles" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/></symbol>
<symbol id="wifi" viewBox="0 0 24 24"><path d="M2.500 9a14 14 0 0 1 19 0M6 12.500a9 9 0 0 1 12 0M9.500 16a4 4 0 0 1 5 0M12 19.500h.01"/></symbol>
<symbol id="fmtl" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1.500"/></symbol>
<symbol id="fmtp" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="1.500"/></symbol>
<symbol id="fmtb" viewBox="0 0 24 24"><rect x="2" y="8" width="12" height="8" rx="1.500"/><rect x="17" y="5" width="5" height="14" rx="1.500"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M7 4v16l13-8L7 4Z"/></symbol>
</defs></svg>
<script src="kit.js"></script>
<script>
// The custom stage: a red-framed picture with room for overlays and a line under it.
const stg=(inner,o={})=>`<div class="stagewrap">${o.extra||''}<div class="stage"><div class="tally ${o.cls||''}"><span class="tag">ON AIR</span>${inner}${o.over||''}</div></div>${o.under||''}</div>`;
const gameOnly=()=>pic('game').replace('<div class="cam"></div>','').replace(/<div class="l3">.*?<\/div>/s,'');
const portPic=k=>pic(k).replace('class="pic ','class="pic port ');
const L3='<div class="l3">KIXELATED<small>Ranked grind, day 12</small></div>';
const CUR='<svg class="xcur" viewBox="0 0 24 24"><path d="M5 3v17l4.500-4.500L12.500 22l3-1.300-3-6.200H19L5 3Z"/></svg>';
const layerRow=(f,name)=>[...f.querySelectorAll('.side.l .ly')].find(r=>r.textContent.includes(name));
const MSGS=(()=>{const d=document.createElement('div');d.innerHTML=T('chatpanel');return n=>{const m=d.querySelector('.msgs').cloneNode(true);[...m.children].slice(n).forEach(c=>c.remove());return m.outerHTML}})();

// A desktop as a display capture sees it: one private window blanked, the studio's own window left out.
const desk=(layers)=>`<div class="pic sh-desk">
  <div class="sh-win" style="left:5%;top:9%;width:42%;height:66%"><div class="sh-tb"><i></i><i></i><i></i><b>Notes</b></div><div class="sh-doc"><b>STREAM PLAN</b><i></i></div></div>
  <div class="sh-win priv" style="left:51%;top:8%;width:34%;height:46%">${I('lock')}</div>
  <div class="sh-task"><i></i><i></i><i class="me"></i><i></i><i></i></div>
  ${layers?'<div class="cam"></div>'+L3:''}</div>`;

// A scene built from slots. `n` guests share the column with the camera; Main takes the rest.
function slotPic(n){
  const c=n>1?26:30, m=91-c, tiles=n+1, start=(100-(tiles*c+(tiles-1)*4))/2;
  const who=[['Camera','#3b6cf6',''],['Guest','#e2574c','Dana'],['Guest','#2fb37a','Ibis']];
  return `<div class="pic lay"><div class="ls" style="left:3%;top:${(100-m)/2}%;width:${m}%;height:${m}%"><div class="in">${gameOnly()}</div><span class="rl">Main</span></div>
  ${who.slice(0,tiles).map(([r,col,nm],i)=>`<div class="ls" style="left:${m+6}%;top:${start+i*(c+4)}%;width:${c}%;height:${c}%"><div class="in face" style="--c:${col}"></div><span class="rl">${r}</span>${nm?`<span class="nmt">${nm}</span>`:''}</div>`).join('')}</div>`;
}
const preset=(name,blocks,on)=>`<div class="al-pre ${on?'on':''}"><div>${blocks.map(b=>`<i style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%"></i>`).join('')}</div>${name}</div>`;

const mvt=(name,inner,o={})=>`<div class="mv-t ${o.st||''}"><div class="th">${inner}</div><div class="mv-n">${o.key?`<kbd>${o.key}</kbd>`:I(o.icon,'sm')}<span class="grow">${name}</span>${o.st=='air'?'<em>ON AIR</em>':o.st=='cued'?'<em>NEXT</em>':o.live?'<i class="dot" style="background:var(--air)"></i>':''}</div></div>`;

const V={
 'autoplace':{label:'Camera auto-placement',cls:'Bd',note:'<b>Camera auto-placement.</b> With Keep out of the way on, the camera weighs a few slots against what matters on screen (the pointer, the focused window, motion, text) and glides to the clearest one. It decides on this machine and moves only when the content changes, so it never jitters.',
   html:()=>topbar('BUILD')+layersCol()+stg(pic('game'),{cls:'ap',
     over:`<div class="ap-o">
       <i class="ap-heat" style="left:-1%;top:4%;width:26%;height:21%"></i><i class="ap-heat" style="right:-2%;top:-3%;width:21%;height:36%"></i>
       <i class="ap-heat" style="left:32%;top:11%;width:36%;height:64%;opacity:.75"></i><i class="ap-heat" style="left:38%;bottom:-3%;width:25%;height:19%"></i>
       <i class="ap-heat" style="left:-2%;bottom:0;width:31%;height:24%"></i><i class="ap-heat" style="left:13%;top:39%;width:14%;height:25%"></i>
       <i class="ap-slot" style="left:3%;top:6%"></i><i class="ap-slot" style="left:42.5%;top:6%"></i>
       <i class="ap-slot" style="left:3%;top:36.67%"></i><i class="ap-slot" style="right:3%;top:36.67%"></i>
       <i class="ap-slot" style="left:3%;bottom:6%"></i><i class="ap-slot" style="left:42.5%;bottom:6%"></i>
       <i class="ap-slot was" style="right:3%;top:6%"></i>
       <span class="ap-hl" style="left:3%;top:18.5%">TEXT</span><span class="ap-hl" style="right:19%;top:3.5%">MOVING</span>
       <span class="ap-hl" style="left:47%;top:67%">MOVING</span><span class="ap-hl" style="left:59.5%;bottom:5.5%">TEXT</span>
       <span class="ap-hl" style="left:22%;bottom:21%">LAYER</span><span class="ap-hl" style="left:15.5%;top:59%">POINTER</span>
       <div style="position:absolute;left:19%;top:48%">${CUR}</div>
       <svg class="ap-arrow" viewBox="0 0 1600 900" preserveAspectRatio="none"><path d="M1372 282C1240 380 1240 520 1364 614M1349.700 583.200 1364 614 1330.400 608.600"/></svg>
     </div>
     <span class="ap-note" style="right:19.500%;top:12%">Was here, over the map</span>
     <span class="ap-note" style="right:22.500%;top:47%">0.4 s glide</span>
     <div class="selbox"><i></i><i></i><i></i><i></i></div>`,
     under:`<div class="under ap-leg"><span class="row"><i class="ap-k h"></i>What matters on screen</span><span class="row"><i class="ap-k s"></i>Places it may go</span><span class="row"><i class="ap-k c"></i>Where it went</span><span class="grow"></span><span class="row">${I('shield','sm')}Decided on this machine</span></div>`})
     +T('inspector')+dock(),
   after:f=>{air(f,'game');
     const s=f.querySelectorAll('.side:not(.l) .sec');
     s[0].querySelector('.f').innerHTML='<span><em>X</em>1574</span><span><em>Y</em>727</span><span><em>W</em>288</span><span><em>H</em>288</span>';
     s[0].insertAdjacentHTML('beforeend',`<div class="ap-box"><span class="dim">Stays clear of</span>
       <div class="ap-chips">${['Pointer','Focused window','Motion','Text'].map(n=>`<span class="chip">${I('check','sm')}${n}</span>`).join('')}</div>
       <div class="row" style="gap:10px"><div class="ap-grid"><i></i><i></i><i></i><i></i><i class="x"></i><i></i><i></i><i></i><i class="on"></i></div><div class="grow">Bottom right<small>Corners first</small></div><span class="chip">Glide · 0.4 s ▾</span></div>
       <span class="dim">Moves only when the content changes.</span></div>`);
     s[3].remove();s[2].style.border=0}},

 'autolayout':{label:'Auto layouts',cls:'L',note:'<b>Auto layouts.</b> A scene built from slots (Main, Camera, Guest) instead of fixed boxes. When a second guest joins, the column reflows by itself: Main keeps the biggest rectangle and nobody drags anything mid-show.',
   html:()=>topbar('BUILD')+`<div class="stagewrap al-wrap">
     <div class="al-row">
       <div class="al-fig"><div class="al-head"><b>One guest</b><span class="dim">a moment ago</span></div><div class="tally past">${slotPic(1)}</div></div>
       <div class="al-join"><span class="chip">${I('users','sm')}Ibis joined</span>${I('arrow')}<span>slots reflow,<br>0.4 s glide</span></div>
       <div class="al-fig"><div class="al-head"><b>Two guests</b><span class="dim">now</span></div><div class="tally"><span class="tag">ON AIR</span>${slotPic(2)}</div></div>
     </div>
     <div class="al-strip">
       <div class="al-col"><span class="cap">Slots in this scene</span><div class="al-roles">
         <div class="al-role"><span class="rl">Main</span><div class="grow">Neon Drift<small>Takes the biggest rectangle</small></div></div>
         <div class="al-role"><span class="rl">Camera</span><div class="grow">Facecam<small>Always first in the column</small></div></div>
         <div class="al-role"><span class="rl">Guest</span><div class="grow">Anyone who joins<small>One slot each, up to four</small></div></div>
       </div></div>
       <div class="al-div"></div>
       <div class="al-col grow"><span class="cap">Arrangement</span><div class="al-pres">
         ${preset('Side column',[[5,22,58,56],[68,10,27,24],[68,38,27,24],[68,66,27,24]],true)}
         ${preset('Bottom row',[[20,7,60,56],[8,69,26,24],[37,69,26,24],[66,69,26,24]])}
         ${preset('Grid',[[6,9,42,38],[52,9,42,38],[6,53,42,38],[52,53,42,38]])}
         ${preset('Picture in picture',[[5,8,90,84]])}
       </div></div>
     </div></div>`+dock(),
   after:f=>{air(f,'duo');const p=f.querySelector('.pad[data-s=duo]');p.querySelector('.th').innerHTML=slotPic(2);p.querySelector('.nm').firstChild.textContent='Guests ';
     f.querySelector('.al-pre:last-child div').insertAdjacentHTML('beforeend','<i style="left:66%;top:56%;width:24%;height:28%;background:var(--dim);outline:2px solid var(--p2)"></i>')}},

 'capturehealth':{label:'Capture health',cls:'Bd',note:'<b>Capture health.</b> A window capture went black, so its layer row, the layer on the picture, its scene pad, and the health dot all turn amber. The popover says what happened in plain words and offers the two fixes.',
   html:()=>topbar('BUILD')+layersCol()+stg(`<div class="pic" style="background:#000"><div class="cam"></div>${L3}</div>`,
     {over:`<div class="ch-out"></div><div class="ch-badge"><span class="hb" style="background:#1a1200;color:var(--cue)">${I('warn','sm')}</span>Neon Drift · no picture</div>`})
     +`<div class="side">
       <div class="tabs"><span class="on">Neon Drift</span><span>Animate</span></div>
       <div class="sec"><span class="cap">Source</span>
         <div class="row" style="gap:10px"><div class="ic" style="background:#e2574c;font:700 13px var(--disp)">N</div><div class="grow">Neon Drift<small class="amber">No picture for 12 s</small></div><span class="chip">Change</span></div>
         <div class="row"><span class="grow">Follow the game</span><span class="dim" style="font-size:11px">finds it after a restart</span><i class="tog on"></i></div>
       </div>
       <div class="sec"><span class="cap">Place</span>
         <div class="f"><span><em>X</em>0</span><span><em>Y</em>0</span><span><em>W</em>1920</span><span><em>H</em>1080</span></div>
         <div class="row"><span class="grow">Fit to the picture</span><div class="seg"><span>Fit</span><span class="on">Fill</span><span>Stretch</span></div></div>
       </div>
       <div class="sec"><span class="cap">Look</span>
         <div class="row"><span class="grow">Color grade</span><span class="chip">None ▾</span></div>
         <div class="sl"><span class="n">Brightness</span><div class="bar" style="--v:50%"></div></div>
         <div class="row dim">${I('plus','sm')}Add a filter</div>
       </div>
       <div class="sec" style="border:0"><span class="cap">Shown in</span>
         <div class="row">${I('link','sm')}<span class="grow">Linked in 2 scenes</span><span class="chip">Make independent</span></div>
       </div></div>`+dock()
     +`<div class="ch-pop"><div class="row" style="align-items:flex-start;gap:10px"><span class="hb">${I('warn','sm')}</span><div class="grow"><b>This window stopped sending pictures.</b><div class="dim" style="margin-top:4px">Neon Drift may have closed or changed how it draws. Viewers see black where it was.</div></div></div>
       <div class="btn pri">Pick it again</div><div class="btn">Capture the whole screen instead</div></div>`,
   after:f=>{air(f,'game');
     layerRow(f,'Facecam').classList.remove('on');const r=layerRow(f,'Neon Drift');r.classList.add('on');
     r.querySelector('small').outerHTML='<small class="amber">Window · no picture for 12 s</small>';r.lastElementChild.outerHTML=`<span class="hb">${I('warn','sm')}</span>`;
     f.querySelector('.pill').innerHTML='<i class="dot" style="background:var(--cue)"></i>1 layer dark';
     const p=f.querySelector('.pad[data-s=game]');p.querySelector('.th').innerHTML=`<div class="pic" style="background:#000"><div class="cam"></div>${L3}</div>`;p.querySelector('.nm').insertAdjacentHTML('beforeend',`<span class="hb">${I('warn','sm')}</span>`)}},

 'mini':{label:'Mini controller',cls:'mn',note:'<b>Mini controller.</b> For one monitor and a full-screen game: a tiny always-on-top bar with four scenes, mic mute, health, and the live clock, and the same state in the tray. The bar is hidden from screen capture, so it never shows up on stream.',
   html:()=>`<div class="mn-bar">${I('tiles','sm')}<b style="font-weight:600">Neon Drift</b><span class="grow"></span><span>Fri 21:42</span><span class="grow"></span>
       <div class="mn-tray me"><div class="logo"></div><i class="dot" style="background:var(--air)"></i><b>01:24:07</b>${I('mic','sm')}</div>
       <div class="mn-tray">${I('vol','sm')}${I('wifi','sm')}</div></div>
     <div class="mn-desk">${gameOnly()}
       <div class="mn-mini"><div class="mn-grip">${I('grip')}</div>
         ${['soon','game','chat','duo'].map((k,i)=>`<div class="mn-pad ${k=='game'?'air':''}">${pic(k)}<kbd>F${i+1}</kbd></div>`).join('')}
         <i class="mn-sep"></i><div class="mn-btn">${I('mic')}</div><i class="dot"></i><div class="onair">LIVE <b>01:24:07</b></div></div>
       <div class="mn-cap">${I('eyeoff','sm')}Hidden from screen capture. Viewers never see this bar.</div>
       <div class="mn-menu">
         <div class="mr"><i class="dot" style="background:var(--air)"></i><span class="grow" style="color:var(--air);font-weight:600">Live</span><b>01:24:07</b></div>
         <div class="mr"><i class="dot"></i><span class="grow">Connection</span><span class="dim">Excellent</span></div>
         <hr><span class="cap">Scenes</span>
         <div class="mr"><span class="sw"></span><span class="grow">Starting soon</span><kbd>F1</kbd></div>
         <div class="mr on"><span class="sw">${I('check','sm')}</span><span class="grow">Gameplay</span><kbd>F2</kbd></div>
         <div class="mr"><span class="sw"></span><span class="grow">Just chatting</span><kbd>F3</kbd></div>
         <div class="mr"><span class="sw"></span><span class="grow">Guest duo</span><kbd>F4</kbd></div>
         <div class="mr"><span class="sw"></span><span class="grow">BRB</span><kbd>F5</kbd></div>
         <hr>
         <div class="mr"><span class="sw">${I('mic','sm')}</span><span class="grow">Mute Desk mic</span><kbd>M</kbd></div>
         <div class="mr"><span class="sw">${I('check','sm')}</span><span class="grow">Show the mini bar</span></div>
         <div class="mr"><span class="sw"></span><span class="grow">Open the studio</span></div>
         <hr>
         <div class="mr" style="color:var(--air)"><span class="sw"></span>End stream…</div>
       </div></div>`},

 'shield':{label:'Privacy shield',cls:'Bd',note:'<b>Privacy shield.</b> In a whole-screen capture, an app marked private is blanked with a lock before the picture leaves this machine, and the studio\'s own window is always left out. The inspector lists the private apps.',
   html:()=>topbar('BUILD')+layersCol()+stg(desk(true),{over:`<span class="tip sh-chip">${I('shield','sm')}Passwords, blanked on stream</span>`})
     +`<div class="side">
       <div class="tabs"><span class="on">Main screen</span><span>Animate</span></div>
       <div class="sec"><span class="cap">Source</span>
         <div class="row" style="gap:10px"><div class="ic" style="background:#3a3a46">${I('mon','sm')}</div><div class="grow">Main screen<small>Whole display</small></div><span class="chip">Change</span></div>
       </div>
       <div class="sec"><div class="row"><span class="cap grow">Privacy shield</span><span class="dim" style="font-size:11px">1 of 3 open now</span></div>
         <div class="dim" style="font-size:12px;line-height:1.45">Private apps are blanked before the picture leaves this machine.</div>
         <div class="sh-list">
           <div class="sh-app"><div class="logo"></div><div class="grow">This studio<small>Always left out</small></div>${I('lock','sm dim')}</div>
           <div class="sh-app open"><div class="ic" style="background:#7a5cff">P</div><div class="grow">Passwords<small>Open now, blanked</small></div><i class="tog on"></i></div>
           <div class="sh-app"><div class="ic" style="background:#1aa37a">M</div><div class="grow">Messages<small>Not open</small></div><i class="tog on"></i></div>
           <div class="sh-app"><div class="ic" style="background:#c9772b">B</div><div class="grow">Bank<small>Not open</small></div><i class="tog on"></i></div>
         </div>
         <div class="row dim">${I('plus','sm')}Mark an app private</div>
       </div>
       <div class="sec" style="border:0"><span class="cap">Place</span>
         <div class="f"><span><em>X</em>0</span><span><em>Y</em>0</span><span><em>W</em>1920</span><span><em>H</em>1080</span></div>
       </div></div>`+dock(),
   after:f=>{air(f,'game');const p=f.querySelector('.pad[data-s=game]');p.querySelector('.th').innerHTML=desk(true);p.querySelector('.nm').firstChild.textContent='Desktop ';
     layerRow(f,'Facecam').classList.remove('on');const r=layerRow(f,'Neon Drift');r.classList.add('on');
     r.querySelector('.ic').outerHTML=`<div class="ic" style="background:#3a3a46">${I('mon','sm')}</div>`;
     r.querySelector('.grow').innerHTML='Main screen<small>Display · 1 app blanked</small>';r.lastElementChild.outerHTML=I('shield','sm')}},

 'drop':{label:'Drop anything',cls:'Bd',note:'<b>Drop anything.</b> Drag a file or a link onto the picture, or paste text, and it becomes the right kind of layer where it lands. The outline names the kind before you let go.',
   html:()=>topbar('BUILD')+`<div class="side l"><div class="tabs"><span>Layers</span><span class="on">Add</span></div>
       <div style="padding:8px 0">
         <div class="ly dim"><span class="cap">Drop or paste anything</span></div>
         <div class="ly on"><div class="ic" style="background:var(--sel)">${I('img','sm')}</div><div class="grow">Image layer<small style="color:var(--text)">logo.png, dropping now</small></div></div>
         <div class="ly"><div class="ic" style="background:#3a3a46">${I('globe','sm')}</div><div class="grow">Web page layer<small>from a web address</small></div></div>
         <div class="ly"><div class="ic" style="background:#3a3a46">${I('film','sm')}</div><div class="grow">Media layer<small>from a video or sound file</small></div></div>
         <div class="ly"><div class="ic" style="background:#3a3a46">${I('type','sm')}</div><div class="grow">Title<small>from pasted text</small></div><kbd>Ctrl V</kbd></div>
         <div class="ly dim" style="margin-top:8px"><span class="cap">Or pick one</span></div>
       </div>
       <div class="lib" style="padding-top:0">${[['mon','Screen'],['win','Window'],['cam','Camera'],['users','Guest'],['img','Image'],['globe','Web page'],['film','Media'],['type','Title']].map(([i,n])=>`<div>${I(i)}${n}</div>`).join('')}</div>
     </div>`+stg(pic('game'),{over:`<div class="dr-land" style="left:9%;top:25%;width:25%;aspect-ratio:1"><span class="rl">${I('img','sm')}Image layer</span><div class="dr-logo"></div>
       <div class="dr-cur">${CUR}<div class="dr-chip"><div class="dr-logo"></div>logo.png</div></div></div>`})
     +T('inspector')+dock()
     +`<svg class="dr-trail" viewBox="0 0 1440 900"><path d="M1150 420C990 330 720 340 528 432"/></svg>
     <div class="dr-fm"><div class="dr-fmt">${I('folder','sm')}Pictures<span class="grow"></span><div class="wc"><i style="background:#454856"></i><i style="background:#454856"></i><i style="background:#454856"></i></div></div>
       <div class="dr-files">
         <div class="dr-file go"><div class="t"><div class="dr-logo" style="opacity:.35"></div></div>logo.png</div>
         <div class="dr-file"><div class="t" style="background:linear-gradient(#1b0b3a,#ff7a3d)"></div>sunset.jpg</div>
         <div class="dr-file"><div class="t" style="background:linear-gradient(135deg,#17324f,#256a73)"></div>desk.jpg</div>
         <div class="dr-file"><div class="t" style="background:radial-gradient(circle at 30% 20%,#3f6fd1,#101a3a 70%);color:#fff">${I('play')}</div>intro.mp4</div>
         <div class="dr-file"><div class="t">${I('vol')}</div>chime.wav</div>
         <div class="dr-file"><div class="t">${I('file')}</div>rules.txt</div>
       </div>
       <div class="dr-foot">6 items, 1 selected</div></div>`,
   after:f=>air(f,'game')},

 'multiview':{label:'Multiview',cls:'mv',note:'<b>Multiview.</b> A window for a second monitor with every scene and source at once. The scene on air is framed red, the cued one amber, a red dot marks the sources in the live picture, and the clock reads from across the room.',
   html:()=>`<div class="mv-h">
       <div class="side3"><div><div class="ttl">MULTIVIEW</div><div class="sub">Friday Night Ranked · 5 scenes, 7 sources</div></div></div>
       <div class="clk">21:42:07</div>
       <div class="side3" style="justify-content:flex-end"><div class="pill"><i class="dot"></i>Excellent</div><div class="onair">LIVE <b>01:24:07</b></div></div>
     </div>
     <div class="mv-g">
       ${mvt('Starting soon',pic('soon'),{key:'F1'})}${mvt('Gameplay',pic('game'),{key:'F2',st:'air'})}${mvt('Just chatting',pic('chat'),{key:'F3',st:'cued'})}${mvt('Guest duo',pic('duo'),{key:'F4'})}
       ${mvt('BRB',pic('brb'),{key:'F5'})}${mvt('Facecam','<div class="pic face"></div>',{icon:'cam',live:1})}${mvt('Neon Drift',gameOnly(),{icon:'win',live:1})}${mvt('Main screen',desk(),{icon:'mon'})}
       ${mvt('Top-down cam',pic('close'),{icon:'cam'})}${mvt('Dana',`<div class="pic face" style="--c:#e2574c;background:linear-gradient(160deg,#3d2a45,#1a1322)"></div>`,{icon:'users'})}${mvt('Intro clip','<div class="pic mv-clip"><b>INTRO</b></div>',{icon:'film'})}${mvt('Alerts','<div class="pic mv-alpha"><div class="mv-alert">pixelfern followed<small>just now</small></div></div>',{icon:'globe',live:1})}
     </div>`},

 'panels':{label:'Private panels',cls:'K pn',note:'<b>Private panels.</b> A panel such as chat floats as its own window, or docks where the picture leaves spare room, as beside a portrait picture. Every panel carries the lock: it is never on stream.',
   html:()=>`<div class="pn-h" style="left:14px"><b>ITS OWN WINDOW</b>beside the studio, or on another monitor</div>
     <div class="pn-h" style="left:802px"><b>DOCKED</b>in the room a portrait picture leaves</div><div class="pn-rule"></div>
     <div class="win">${topbar('LIVE',{compact:true})}${stage()}<div class="dock">${T('scenes')}${quick}</div>${T('mix')}</div>
     <div class="pn-chat"><div class="pn-tb"><b>Chat</b><span class="grow"></span>${I('dockr','sm')}<div class="wc" style="margin:0"><i></i><i></i><i></i></div></div>
       <div class="pn-lock">${I('lock','sm')}Private panel, never on stream</div>${MSGS(10)}<div class="input sm">Send a message</div></div>
     <div class="pn-b">${topbar('LIVE',{nav:false,compact:true})}
       <div class="snav">${snav('LIVE').replace(/^<div class="snav">|<\/div>$/g,'')}<div class="ib b cue">${I('shield')}</div></div>
       <div class="pn-mid">${stage({port:true,pic:'sell'})}
         <div class="pn-sc">${['soon','close','chat','brb'].map((k,i)=>`<div class="pad ${i==1?'air':''}">${i==1?'<span class="tg">ON AIR</span>':''}<div class="th">${pic(k)}</div><div class="nm">${['Soon','Close-up','Chatting','BRB'][i]}</div></div>`).join('')}</div>
         ${T('mix')}</div>
       <div class="side"><div class="tabs"><span class="on">Chat</span><span>Activity</span><span>${I('popout','sm')}</span></div>
         <div class="pn-lock">${I('lock','sm')}Private panel, never on stream</div>${MSGS(10)}<div class="input sm">Send a message</div></div>
     </div>`,
   after:f=>{air(f,'game');f.querySelectorAll('.win .pad').forEach((p,i)=>{if(i>2)p.remove()});const t=f.querySelector('.win .tr');t&&t.remove()}},

 'dual':{label:'Both formats at once',cls:'L du',note:'<b>Both formats at once.</b> One show, a landscape picture and a portrait picture, both on air. Each scene pad shows the pair, and a chip on a layer says where it is shown: both, landscape, or portrait.',
   html:()=>topbar('LIVE')+`<div class="stagewrap"><div class="du-row">
       <div class="du-fig"><div class="tally" style="width:996px;height:560px"><span class="tag">ON AIR</span>${pic('game')}
           <div class="selbox"><i></i><i></i><i></i><i></i></div></div>
         <div class="du-cap">${I('fmtl','sm')}<span class="cap">Landscape</span>1920 × 1080<span class="grow"></span><div class="ctx"><span class="du-lab">${I('cam','sm')}Facecam is shown in</span><span class="on">${I('fmtb','sm')}Both</span><span>${I('fmtl','sm')}Landscape</span><span>${I('fmtp','sm')}Portrait</span></div><span class="grow"></span><i class="dot"></i>6.0 Mb/s</div></div>
       <div class="du-fig"><div class="tally port" style="width:315px;height:560px"><span class="tag">ON AIR</span>${portPic('game')}
           <div class="selbox" style="right:6%;bottom:16%;width:34%"><i></i><i></i><i></i><i></i></div></div>
         <div class="du-cap">${I('fmtp','sm')}<span class="cap">Portrait</span>1080 × 1920<span class="grow"></span><i class="dot"></i>4.5 Mb/s</div></div>
     </div></div>`+dock(),
   after:f=>{air(f,'game');f.querySelectorAll('.pad[data-s]').forEach(p=>{const k=p.dataset.s;p.querySelector('.th').innerHTML=`<div class="du-l">${pic(k)}</div><div class="du-p">${portPic(k)}</div>`})}},
};
mount(V);
</script>
</body>
</html>
