[package]
# Unpublished until the packaging quest decides how the studio ships.
publish = false
name = "moq-studio"
description = "A native streaming studio that composites scenes on the GPU and goes live over MoQ"
authors.workspace = true
repository.workspace = true
license.workspace = true

version = "0.0.1"
edition.workspace = true
rust-version.workspace = true

keywords = ["quic", "streaming", "studio", "live", "media"]
categories = ["multimedia", "multimedia::video", "gui"]

[features]
default = ["nvidia"]
# Camera, display, window, microphone, and system-audio sources, and playing a
# mix to the speakers. Off by default like moq-cli's `capture`: on Linux the
# microphone and the speakers link libasound at build time. Enable with
# `cargo run -p moq-studio --features capture,openh264`.
capture = ["moq-scene/capture", "moq-audio/playback"]
# NVIDIA hardware codecs (NVENC + NVDEC) on Linux, as in moq-cli.
nvidia = ["moq-video/nvidia"]
# The vendored OpenH264 software H.264 fallback, opt-in like moq-video's.
openh264 = ["moq-video/openh264"]
# Intel/AMD VAAPI hardware codecs (Linux), with libva loaded at runtime.
vaapi = ["moq-video/vaapi"]
# PipeWire cameras, drawn without a copy, audio through the sound server, the
# virtual camera as a PipeWire node, and displays and windows picked in the
# desktop's screen-sharing picker, the way to share a Wayland screen.
pipewire = ["capture", "moq-scene/pipewire", "dep:pipewire"]
# What every packaged build ships: each backend its platform loads without a
# system library at startup. `pipewire` is not one; the Flatpak, which bundles
# libpipewire, adds it.
release = ["capture", "nvidia", "openh264", "vaapi"]
# Browser sources, rendered by CEF in a helper process (Linux and macOS). Off
# by default: the build downloads the CEF runtime (or takes it from
# `CEF_PATH`). On Linux it copies it beside the binary, where the binary looks
# for it when it starts; on macOS packaging/macos/bundle.sh puts it in the app
# bundle, the only place browser sources run from there.
cef = ["moq-scene/cef"]

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
# A picture pasted from the clipboard, which egui pastes only as text. eframe's
# release, already in the graph through egui-winit; on Linux it reads the X11
# clipboard, which a Wayland desktop shares through Xwayland.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
bytes = { workspace = true }
# The window, its event loop, and the egui integration. `wgpu` is the renderer
# the compositor shares a device with; no glow, no system font discovery.
# `persistence` keeps per-user picks, such as the output Listen plays on, out
# of the shared scene file. `accesskit` describes every widget to screen
# readers, and to `--control`, which drives the window by those descriptions.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
egui = "0.36"
# The kit's icons, Lucide's SVGs, drawn at whatever size and scale they are shown.
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
# `--headless`: the window run off-screen, frame by frame, and drawn on the
# compositor's GPU when asked for a picture.
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
# `--watch` awaits the composition broadcast's catalog.
hang = { workspace = true, features = ["async"] }
# Stamps a recording's file name with when it started. Already in the graph
# through moq-scene's humantime-serde.
humantime = { workspace = true }
# How long a guest's link lasts, as the stream settings file spells it.
humantime-serde = { workspace = true }
# The multiview's clock, in the system's time zone. Already in the graph.
jiff = "0.2.37"
# The relay tokens, in the operating system's credential store rather than a
# file; each platform's store is its own crate, below.
keyring-core = "1.0"
kio = { workspace = true, features = ["async", "runtime"] }
moq-audio = { workspace = true }
# Signs guest tokens with the room key.
moq-auth = { workspace = true }
moq-json = { workspace = true, features = ["async"] }
moq-mux = { workspace = true }
moq-net = { workspace = true }
moq-scene = { workspace = true }
moq-stats = { workspace = true, features = ["async"] }
moq-tokio = { workspace = true }
moq-video = { workspace = true }
# A recording's length, from its movie header; the version moq-mux writes it
# with.
mp4-atom = "0.17.0"
# A show's picture in the library, the last frame of its program.
png = "0.18"
pollster = { workspace = true }
# The window, to ask where the pointer is during a drag, and whether it is on
# Wayland, where only the portal hears keys globally.
raw-window-handle = "0.6"
# The join link's QR code. No dependencies of its own.
qrcodegen = "1.8"
# The system's own dialog for opening a show file or saving a new one: the
# desktop portal on Linux, so it works in the Flatpak.
rfd = "0.18"
# Whether a recording's marker is still the file its holder locked, which std
# cannot tell on Windows.
same-file = "1.0.6"
# The guests removed from scenes, kept beside the scene file.
serde = { workspace = true }
# `--control`'s requests and replies, a JSON object a line. Already in the
# graph.
serde_json = "1.0.154"
# Glows, pulses, bursts, and fills in the UI, drawn on its wgpu device.
rune-fx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
usage-rs = { workspace = true, features = ["completions", "config"] }
# The compositor's device, shared with the window.
wgpu = { workspace = true }
# The window's event loop, run here so a hotkey is the key winit names by where
# it sits, which egui folds into its main keyboard twin for a keypad key and
# drops for a key outside its own list. eframe's version and features, with
# `serde` to keep the key bound.
winit = { version = "0.30", default-features = false, features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The GlobalShortcuts portal for hotkeys on Wayland, and the Settings portal's
# reduced motion for the effects. 0.13 on `async-io`, as moq-video's PipeWire
# capture uses, so the two share one D-Bus stack; ashpd refuses both backends.
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "settings", "async-io"] }
futures-util = "0.3"
# The virtual camera's v4l2loopback fallback. Pure Rust with its kernel bindings
# checked in, and already in the graph through moq-video's capture.
moq-v4l = { workspace = true }
# The virtual camera's PipeWire node, behind `pipewire`. moq-video links the
# same release; `v0_3_34` adds the trigger a driving stream paces frames with.
pipewire = { version = "0.10", optional = true, features = ["v0_3_34"] }
# Hotkeys on X11, grabbed by keycode so any key binds on any layout. `xkb`
# tells a held key's repeats from new presses.
x11rb = { version = "0.13", features = ["xkb"] }
# Relay tokens in the Secret Service (GNOME Keyring, KWallet), over the D-Bus
# stack ashpd uses, with no system library. Its `rt-tokio` puts that zbus on
# tokio, so the portals keep needing a tokio runtime, as before.
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(unix)'.dependencies]
# The room left on the recordings folder's disk, and whose process is on the
# other end of `--control`'s socket. moq-scene's release.
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# System-wide hotkeys on macOS and Windows; X11 grabs keys itself, and Wayland
# goes through the GlobalShortcuts portal.
global-hotkey = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# Whether the system asks apps to reduce motion, for the effects. eframe's
# version, already in the graph through winit.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
# Relay tokens in the login keychain.
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
# The virtual camera: activating the camera extension the app bundle carries,
# then feeding its cameras through CoreMediaIO. The releases moq-video's
# capture builds on.
block2 = "0.6"
dispatch2 = "0.3"
moq-studio-camera = { workspace = true }
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-media-io = "0.3"
objc2-core-video = "0.3"
objc2-foundation = { version = "0.3", features = ["NSBundle"] }
objc2-system-extensions = "0.3"

[target.'cfg(windows)'.dependencies]
# Which virtual key the foreground window's layout puts on each key, so a
# hotkey registers the key pressed, and whether the system asks apps to
# reduce motion, for the effects, and the room left on the recordings folder's
# disk.
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Relay tokens in the Windows Credential Manager. Without `search`, which the
# studio never does, so no regex.
windows-native-keyring-store = { version = "1.1", default-features = false }

[build-dependencies]
# Rasterizes the app icon's SVG for the window. No text or embedded images, so
# neither feature.
resvg = { version = "0.50", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# A clock that moves wall time too, which renewed tokens' expiries read.
kio = { workspace = true, features = ["manual"] }
# The auth server a test relay verifies guest tokens with.
moq-auth = { workspace = true, features = ["serve"] }
moq-relay = { workspace = true, features = ["test-support"] }
# A paused clock, so health tests sample without waiting.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
