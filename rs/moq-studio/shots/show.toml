# The show `just shots` renders every view on: still sources only, so a
# still view draws the same picture each run. Add what a new view needs.
version = 1

[canvas]
width = 1920
height = 1080
framerate = 30

[sources.host]
kind = "image"
path = "person.jpg"

[sources.backdrop]
kind = "color"
color = "#101828"

[sources.bar]
kind = "color"
color = "#2563ebe6"

# Shown by no layer, which Add offers to place or remove.
[sources.highlight]
kind = "color"
color = "#f59e0b"

[sources.guest]
kind = "broadcast"
path = "room/guest"

[sources.caller]
kind = "broadcast"
path = "room/caller"

[[scenes]]
name = "Main"
items = [
    { source = "backdrop", rect = { x = 0, y = 0, width = 1920, height = 1080 } },
    { source = "host", rect = { x = 0, y = 0, width = 1920, height = 1080 } },
    { source = "bar", rect = { x = 80, y = 860, width = 900, height = 120 } },
]

[[scenes]]
name = "Interview"
items = [
    { source = "backdrop", rect = { x = 0, y = 0, width = 1920, height = 1080 } },
    { source = "host", rect = { x = 60, y = 270, width = 880, height = 495 } },
    { source = "guest", rect = { x = 980, y = 270, width = 880, height = 495 } },
]

[[scenes]]
name = "Break"
safe = true # the scene the panic key cuts to
items = [
    { source = "backdrop", rect = { x = 0, y = 0, width = 1920, height = 1080 } },
    { source = "bar", rect = { x = 460, y = 480, width = 1000, height = 120 } },
]

# A scene the program refuses, at a size of its own, whose pad says why.
[[scenes]]
name = "Vertical"
size = { width = 1080, height = 1920 }
items = [
    { source = "backdrop", rect = { x = 0, y = 0, width = 1080, height = 1920 } },
    { source = "host", rect = { x = 0, y = 656, width = 1080, height = 608 } },
]

[[audio_scenes]]
name = "Program"
program = true
sounds = ["caller", "guest"]
