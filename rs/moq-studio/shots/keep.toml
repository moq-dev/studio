# The show the Keep out of the way view renders: a game, as an overlay whose
# road rolls and sun bobs on the program clock, under a facecam that keeps
# out of the way. It starts over the minimap, and leaves it.
version = 1

[canvas]
width = 1920
height = 1080
framerate = 30

[sources.facecam]
kind = "image"
path = "person.jpg"

[sources.game]
kind = "overlay"
width = 1920
height = 1080
html = """
<style>
  body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: "Noto Sans"; color: white;
    background: linear-gradient(#160a36, #4a1a6b 40%, #ff6a3d 57%, #2a0d45 57.5%, #0b0520); }
  .sun { position: absolute; left: 790px; top: 170px; width: 340px; height: 340px; border-radius: 50%;
    background: linear-gradient(#ffd36b, #ff5fa2); animation: bob 1.6s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(-40px) } to { transform: translateY(60px) } }
  .road { position: absolute; left: 520px; top: 640px; width: 880px; height: 440px; overflow: hidden; }
  .lines { position: absolute; left: 0; top: -36px; width: 880px; height: 520px;
    background: repeating-linear-gradient(#ff3df0 0px, #ff3df0 18px, #0b0520 18px, #0b0520 36px);
    animation: roll 0.9s linear infinite; }
  @keyframes roll { from { transform: translateY(0) } to { transform: translateY(36px) } }
  .hp { position: absolute; left: 64px; top: 64px; width: 360px; height: 22px; border: 3px solid white; }
  .hp div { width: 70%; height: 100%; background: #3ddc84; }
  .hp-label { position: absolute; left: 64px; top: 100px; font-size: 26px; font-weight: bold; letter-spacing: 3px; }
  .map { position: absolute; left: 1536px; top: 40px; width: 340px; height: 300px; border: 4px solid #c9f6ff;
    background: #0d1b2a; overflow: hidden; }
  .map .row { display: flex; height: 30px; }
  .map .row div { width: 30px; height: 30px; border: 1px solid #3b6c8a; box-sizing: border-box; }
  .map .row div.wall { background: #6fb7d9; }
  .score { position: absolute; left: 0; width: 1920px; top: 930px; text-align: center; font-size: 72px; font-weight: bold; }
  .third { position: absolute; left: 64px; top: 860px; padding: 16px 28px; border-left: 8px solid #ff5f6d; background: #00000080; }
  .third b { display: block; font-size: 48px; letter-spacing: 4px; }
  .third span { font-size: 26px; }
</style>
<div class="sun"></div>
<div class="road"><div class="lines"></div></div>
<div class="hp"><div></div></div>
<div class="hp-label">HP 82 / 100</div>
<div class="map">
  <div class="row"><div class="wall"></div><div></div><div></div><div class="wall"></div><div></div><div></div><div class="wall"></div><div></div><div></div><div class="wall"></div><div></div><div></div></div>
  <div class="row"><div></div><div class="wall"></div><div></div><div></div><div class="wall"></div><div></div><div></div><div></div><div class="wall"></div><div></div><div class="wall"></div><div></div></div>
  <div class="row"><div></div><div></div><div class="wall"></div><div></div><div></div><div class="wall"></div><div class="wall"></div><div></div><div></div><div></div><div></div><div class="wall"></div></div>
  <div class="row"><div class="wall"></div><div></div><div></div><div></div><div class="wall"></div><div></div><div></div><div class="wall"></div><div></div><div class="wall"></div><div></div><div></div></div>
  <div class="row"><div></div><div class="wall"></div><div class="wall"></div><div></div><div></div><div></div><div class="wall"></div><div></div><div></div><div></div><div class="wall"></div><div></div></div>
  <div class="row"><div></div><div></div><div></div><div class="wall"></div><div></div><div class="wall"></div><div></div><div></div><div class="wall"></div><div></div><div></div><div class="wall"></div></div>
  <div class="row"><div class="wall"></div><div></div><div class="wall"></div><div></div><div></div><div></div><div></div><div class="wall"></div><div></div><div class="wall"></div><div></div><div></div></div>
  <div class="row"><div></div><div></div><div></div><div class="wall"></div><div class="wall"></div><div></div><div></div><div></div><div></div><div></div><div class="wall"></div><div></div></div>
  <div class="row"><div></div><div class="wall"></div><div></div><div></div><div></div><div class="wall"></div><div></div><div class="wall"></div><div></div><div></div><div></div><div class="wall"></div></div>
  <div class="row"><div class="wall"></div><div></div><div></div><div class="wall"></div><div></div><div></div><div></div><div></div><div class="wall"></div><div class="wall"></div><div></div><div></div></div>
</div>
<div class="score">24 / 120</div>
<div class="third"><b>KIXELATED</b><span>Ranked grind, day 12</span></div>
"""

[[scenes]]
name = "Gameplay"
items = [
    { source = "game", rect = { x = 0, y = 0, width = 1920, height = 1080 } },
    { source = "facecam", rect = { x = 1578, y = 54, width = 288, height = 288 }, crop = { left = 0.21875, right = 0.21875 }, shape = { corners = [
        0.5,
        0.5,
        0.5,
        0.5,
    ], border = 6 }, keep_clear = {} },
]

[[audio_scenes]]
name = "Program"
program = true
