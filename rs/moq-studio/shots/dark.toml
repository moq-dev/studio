# The show `just shots` renders a capture gone dark on: a game's window under
# the host and a lower third. A view's build cannot capture, so the view says
# the window went dark, and it draws nothing over the black behind it.
version = 1

[canvas]
width = 1920
height = 1080
framerate = 30

[sources.game]
kind = "picked_window"

[sources.host]
kind = "image"
path = "person.jpg"

[sources.black]
kind = "color"
color = "#000000"

[sources.bar]
kind = "color"
color = "#2563ebe6"

[[scenes]]
name = "Gameplay"
items = [
    { source = "black", rect = { x = 0, y = 0, width = 1920, height = 1080 } },
    { source = "game", rect = { x = 0, y = 0, width = 1920, height = 1080 } },
    { source = "host", rect = { x = 1440, y = 690, width = 400, height = 300 } },
    { source = "bar", rect = { x = 80, y = 900, width = 700, height = 110 } },
]

[[scenes]]
name = "Chatting"
items = [
    { source = "black", rect = { x = 0, y = 0, width = 1920, height = 1080 } },
    { source = "host", rect = { x = 0, y = 0, width = 1920, height = 1080 } },
]

[[scenes]]
name = "Break"
items = [
    { source = "black", rect = { x = 0, y = 0, width = 1920, height = 1080 } },
    { source = "bar", rect = { x = 460, y = 480, width = 1000, height = 120 } },
]
