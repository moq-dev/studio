[package]
# Unpublished until the studio settles its API; moq-studio is its only consumer.
publish = false
name = "moq-scene"
description = "Scene graph, live sources, and a wgpu compositor for a MoQ streaming studio"
authors.workspace = true
repository.workspace = true
license.workspace = true

version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

keywords = ["quic", "media", "video", "compositing", "live"]
categories = ["multimedia", "multimedia::video", "rendering"]

[features]
# Camera, display, window, and microphone sources. Off by default for the same
# reason as moq-video's and moq-audio's `capture`: on Linux the microphone links
# libasound at build time, and a workspace build would otherwise unify it on for
# every crate. Without it, those sources report that the build cannot capture.
capture = ["moq-video/capture", "moq-audio/capture"]
# PipeWire cameras on Linux, whose DMA-BUFs the compositor imports rather than
# uploads, and audio devices through the sound server. Off by default like
# moq-video's `pipewire`: it links libpipewire-0.3 at build time, so a Linux
# package turns it on where the build host has it.
pipewire = ["capture", "moq-video/pipewire", "moq-audio/pipewire"]
# Browser sources, rendered by CEF (the Chromium Embedded Framework) in a helper
# process, on Linux and macOS. Off by default: the build downloads the CEF
# runtime, or takes it from `CEF_PATH`, and compiles its C++ wrapper. Without
# it, a browser source reports that this build cannot render web pages.
cef = ["dep:cef", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

# CEF's subprocesses on macOS, which run from helper apps of their own in the
# app bundle rather than from the studio's executable.
[[bin]]
name = "moq-browser-helper"
path = "src/bin/browser-helper.rs"
required-features = ["cef"]

[dependencies]
# Overlays: Blitz lays HTML and CSS out and paints it into a Vello scene, which
# Vello renders on the compositor's device. Pinned to the beta whose Vello and
# wgpu match moq-video's: the stable 0.2 line is on wgpu 26, which cannot share
# the device. System fonts and network access are left off, so an overlay loads
# only its own assets; `woff` decodes the WOFF and WOFF2 fonts it loads.
anyrender_vello = "0.15"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["woff"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
# Decodes an overlay's base64 `data:` URLs.
base64 = "0.23"
bytemuck = { version = "1", features = ["derive"] }
bytes = { workspace = true }
# Reads the declarations an overlay's CSS checks, as Stylo serializes them.
cssparser = "0.38"
# The faces every overlay's text is set in: Noto Sans, regular, bold, and italic.
notosans = "0.1"
# Blitz's text layout, to register those faces as every family's.
parley = { version = "0.12", default-features = false, features = ["std"] }
# The catalog's rendition configs, which a broadcast source follows.
hang = { workspace = true }
humantime-serde = { workspace = true }
# PNG and JPEG still images. Already in a studio's graph through eframe.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
kio = { workspace = true, features = ["runtime"] }
moq-audio = { workspace = true }
moq-mux = { workspace = true }
moq-net = { workspace = true }
# `render` is the compositor's whole input path: it turns every decoded or
# captured frame into a texture on the studio's device.
moq-video = { workspace = true, features = ["render"] }
# Decodes an overlay's `data:` URLs.
percent-encoding = "2"
serde = { workspace = true }
serde_with = { workspace = true }
# Stylo, Blitz's style engine, which parses an overlay's CSS to check it.
style = { package = "stylo", version = "0.22" }
# Replaces the grants file whole, created readable by its owner alone; also
# the browser helper's CEF profile, removed once the helper has exited.
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
# Runs background removal's person segmentation model on the CPU. Pure Rust, so
# it builds wherever the studio does with no runtime library to download.
tract-onnx = { version = "0.23.10", default-features = false }
url = { workspace = true }
# The compositor's device; moq-video's release, so its decoded textures share it.
wgpu = { workspace = true }
vello = "0.11"
# Decompresses an overlay's WOFF and WOFF2 fonts to check them. Already in the
# graph through Blitz's `woff` feature.
wuff = "0.2"

# The helper process a browser source runs CEF in, and the socket between them.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# `accelerated_osr` copies the page's shared texture into the studio's device.
cef = { version = "156.3", default-features = false, features = ["accelerated_osr"], optional = true }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rustix = { version = "1", features = ["fs", "net", "process", "stdio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Which GPU the X server runs on, which CEF paints on under X11. Pure Rust, and
# 0.13 as the studio's hotkeys use.
x11rb = { version = "0.13", features = ["dri3"] }
# Whether the Wayland display has an output, without which CEF's `initialize`
# hangs. Pure Rust, and 0.31 as eframe's winit uses.
wayland-client = "0.31"

# Each is the release already in the graph through wgpu and winit.
[target.'cfg(target_os = "macos")'.dependencies]
# A page's shared texture is an IOSurface, which reaches the studio only as a
# Mach port, sent to a bootstrap service the studio checks in.
mach2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "libc", "objc2-core-foundation"] }
# The helper's NSApplication, which CEF needs to take part in its event
# handling, kept out of the Dock and out of App Nap.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSRunningApplication",
], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"], optional = true }

[dev-dependencies]
# Reads the layer layout track back as a player would.
moq-json = { workspace = true, features = ["async"] }
# An encoder on every machine, for the source track and replay tests.
moq-video = { workspace = true, features = ["openh264"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Describes the IOSurface the Mach rendezvous test sends.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }

[lints]
workspace = true
