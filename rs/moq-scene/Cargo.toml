[package]
# Unpublished until the studio settles its API; moq-studio is its only consumer.
publish = false
name = "moq-scene"
description = "Scene graph, live sources, and a wgpu compositor for a MoQ streaming studio"
authors.workspace = true
repository.workspace = true
license.workspace = true

version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

keywords = ["quic", "media", "video", "compositing", "live"]
categories = ["multimedia", "multimedia::video", "rendering"]

[features]
# Camera, display, window, and microphone sources. Off by default for the same
# reason as moq-video's and moq-audio's `capture`: on Linux the microphone links
# libasound at build time, and a workspace build would otherwise unify it on for
# every crate. Without it, those sources report that the build cannot capture.
capture = ["moq-video/capture", "moq-audio/capture"]
# PipeWire cameras on Linux, whose DMA-BUFs the compositor imports rather than
# uploads, and audio devices through the sound server. Off by default like
# moq-video's `pipewire`: it links libpipewire-0.3 at build time, so a Linux
# package turns it on where the build host has it.
pipewire = ["capture", "moq-video/pipewire", "moq-audio/pipewire"]
# Browser sources, rendered by CEF (the Chromium Embedded Framework) in a helper
# process, on Linux. Off by default: the build downloads the CEF runtime, or
# takes it from `CEF_PATH`, and compiles its C++ wrapper. Without it, a browser
# source reports that this build cannot render web pages.
cef = ["dep:cef"]

[dependencies]
# Overlays: Blitz lays HTML and CSS out and paints it into a Vello scene, which
# Vello renders on the compositor's device. Pinned to the beta whose Vello and
# wgpu match moq-video's: the stable 0.2 line is on wgpu 26, which cannot share
# the device. Fonts and network access are left off, so an overlay loads nothing.
anyrender_vello = "0.15"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
bytemuck = { version = "1", features = ["derive"] }
bytes = { workspace = true }
# Reads the declarations an overlay's CSS checks, as Stylo serializes them.
cssparser = "0.38"
# The faces every overlay's text is set in: Noto Sans, regular, bold, and italic.
notosans = "0.1"
# Blitz's text layout, to register those faces as every family's.
parley = { version = "0.12", default-features = false, features = ["std"] }
# The catalog's rendition configs, which a broadcast source follows.
hang = { workspace = true }
humantime-serde = { workspace = true }
# PNG and JPEG still images. Already in a studio's graph through eframe.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
kio = { workspace = true, features = ["runtime"] }
moq-audio = { workspace = true, features = ["bus"] }
moq-mux = { workspace = true }
moq-net = { workspace = true }
# `render` is the compositor's whole input path: it turns every decoded or
# captured frame into a texture on the studio's device.
moq-video = { workspace = true, features = ["render"] }
serde = { workspace = true }
serde_with = { workspace = true }
# Stylo, Blitz's style engine, which parses an overlay's CSS to check it.
style = { package = "stylo", version = "0.22" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
# Runs background removal's person segmentation model on the CPU. Pure Rust, so
# it builds wherever the studio does with no runtime library to download.
tract-onnx = { version = "0.23.10", default-features = false }
url = { workspace = true }
vello = "0.11"

# The helper process a browser source runs CEF in, and the socket between them.
[target.'cfg(target_os = "linux")'.dependencies]
# `accelerated_osr` copies the page's shared texture into the studio's device.
cef = { version = "156.3", default-features = false, features = ["accelerated_osr"], optional = true }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rustix = { version = "1", features = ["net", "process", "stdio"] }
# The helper's CEF profile, removed once the helper has exited.
tempfile = { workspace = true }

[dev-dependencies]
# An encoder on every machine, for the source track and replay tests.
moq-video = { workspace = true, features = ["openh264"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
