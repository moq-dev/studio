name: Check

permissions:
  contents: read

# Ready PRs into main run the full `just ci`; drafts skip it. Pushes to main run
# it too, since a merge is nobody's pull request.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 60
    env:
      NEXTEST_PROFILE: ci
      # No auto maintenance in this throwaway checkout. Checkout disables gc
      # only in the superproject, so the moq submodule's fetch leaves a
      # detached maintenance that rewrites its shallow file mid-unshallow,
      # failing the pin check.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # Only a PR that moves the pin fetches moq's history, so an unchanged pin
      # never fails on the network.
      - name: The moq pin is on moq's main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --no-tags --depth=1 origin "$BASE"
          if [ "$(git rev-parse "$BASE:moq")" != "$(git rev-parse HEAD:moq)" ]; then
            sh/check-moq-main.sh
          fi

      - uses: ./.github/actions/nix

      - name: Check
        run: nix develop --command just ci
