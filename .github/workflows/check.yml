name: Check

permissions:
  contents: read

# Runs the full `just ci` on every push to main. Pull requests run no CI:
# authors run `just ci` before pushing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04-arm
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 60
    env:
      NEXTEST_PROFILE: ci
      # No auto maintenance in this throwaway checkout. Checkout disables gc
      # only in the superproject, so the moq submodule's fetch leaves a
      # detached maintenance that rewrites its shallow file mid-unshallow,
      # failing the pin check.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/nix

      - name: Check
        run: nix develop --command just ci
