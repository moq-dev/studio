name: Flatpak

# Builds the Flatpak bundle for each architecture, installs it, and checks it
# launches and lists devices. Pull requests that change the packaging run it;
# nightly runs it against main, and release.yml ships what it builds.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/flatpak.yml
      - packaging/flatpak/**
      - packaging/*.svg
  workflow_call:
  workflow_dispatch:

concurrency:
  # A called run takes its caller's workflow name, keeping its group apart
  # from the caller's own.
  group: flatpak-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder sway pipewire wireplumber xdg-desktop-portal
          # Ubuntu's AppArmor keeps bubblewrap, the sandbox both flatpak and
          # flatpak-builder run in, from making user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --state-dir=.tmp/flatpak/state --repo=.tmp/flatpak/repo --force-clean .tmp/flatpak/build packaging/flatpak/live.kixel.studio.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            .tmp/flatpak/repo "moq-studio-${{ matrix.arch }}.flatpak" live.kixel.studio

      - name: Install
        run: flatpak install --user -y --noninteractive "moq-studio-${{ matrix.arch }}.flatpak"

      - name: Smoke test
        run: packaging/flatpak/smoke.sh

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: moq-studio-${{ matrix.arch }}.flatpak
          if-no-files-found: error
