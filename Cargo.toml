[workspace]
members = ["rs/moq-scene", "rs/moq-studio"]
# The moq submodule is its own cargo workspace; exclude it so this one does not
# try to adopt its members.
exclude = ["moq"]
resolver = "2"

[workspace.package]
# egui 0.36 and egui_dock 0.21 need 1.92 and 1.95, and moq-relay (a test
# dependency) needs 1.95. rust-toolchain.toml pins the build toolchain above it.
rust-version = "1.95"
edition = "2024"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/studio"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
# Every suppression says why, so the next lint audit can judge it.
allow_attributes_without_reason = "warn"

# Every moq crate is a path dependency into the `moq` submodule, so they all
# compile against one checkout and cargo unifies moq-net, hang, and kio across
# them. The submodule's gitlink is the single pin; sh/check-moq-pin.sh fails
# `just check` if a moq git dependency appears or the checkout drifts from it.
[workspace.dependencies]
hang = { path = "moq/rs/hang" }
kio = { path = "moq/rs/kio" }
moq-auth = { path = "moq/rs/moq-auth", default-features = false }
moq-audio = { path = "moq/rs/moq-audio", default-features = false }
moq-json = { path = "moq/rs/moq-json" }
moq-mux = { path = "moq/rs/moq-mux" }
moq-net = { path = "moq/rs/moq-net" }
moq-relay = { path = "moq/rs/moq-relay", default-features = false }
moq-room = { path = "moq/rs/moq-room" }
moq-scene = { path = "rs/moq-scene" }
moq-stats = { path = "moq/rs/moq-stats" }
moq-tokio = { path = "moq/rs/moq-tokio", default-features = false }
moq-v4l = { path = "moq/rs/moq-v4l" }
# Default features off, as in moq: each consumer opts into native codecs and
# rendering explicitly.
moq-video = { path = "moq/rs/moq-video", default-features = false }

anyhow = "1"
bytes = "1"
humantime = "2.4"
humantime-serde = "1.1.1"
pollster = "1.0"
# The effects the studio UI draws inside egui. Rune is pre-release and asks for
# a rev pin; its `dev` branch is never rewritten.
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "b99c7b04e75c0b7587fe8d09ba6a679e11ede9c9" }
# The Rune UI spike (quest/m1/rune-spike.md), at the rune-fx rev.
rune = { git = "https://github.com/anomalyco/rune", rev = "b99c7b04e75c0b7587fe8d09ba6a679e11ede9c9" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "b99c7b04e75c0b7587fe8d09ba6a679e11ede9c9" }
serde = { version = "1", features = ["derive"] }
serde_with = "3"
tempfile = "3"
thiserror = "2"
tokio = "1.48"
toml = "1.1"
tracing = "0.1"
url = "2"
usage-rs = "7.1.0"

[profile.dev]
# Line tables keep file and line in every backtrace and panic, without the
# variable and type records that make a debug build of this graph enormous.
# `profile.test` inherits this.
debug = "line-tables-only"

# moq-audio's dependencies whose hot loops are SIMD intrinsics, which compile to
# out-of-line calls with debug checks at opt-level 0: unoptimized, the sonora
# echo canceller runs slower than realtime. Optimize them even in dev and test
# builds, as moq does; nobody steps through them in a debugger.
[profile.dev.package.sonora]
opt-level = 3

[profile.dev.package.sonora-aec3]
opt-level = 3

[profile.dev.package.sonora-agc2]
opt-level = 3

[profile.dev.package.sonora-common-audio]
opt-level = 3

[profile.dev.package.sonora-fft]
opt-level = 3

[profile.dev.package.sonora-ns]
opt-level = 3

[profile.dev.package.sonora-simd]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

# Background removal's model, which runs on every picture of a source and is
# ten times slower unoptimized: a camera would cut out a few pictures a
# second rather than every one.
[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3

[profile.dev.package.tract-linalg]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# The spike's Rune needs `adopt_gpu`, which Rune lacks: `sh/rune-spike/setup.sh` checks
# out the pinned rev with `sh/rune-spike/rune.patch` applied where these point.
[patch."https://github.com/anomalyco/rune"]
rune = { path = ".tmp/rune/crates/rune" }
rune-fx = { path = ".tmp/rune/crates/rune-fx" }
rune-kit = { path = ".tmp/rune/crates/rune-kit" }
